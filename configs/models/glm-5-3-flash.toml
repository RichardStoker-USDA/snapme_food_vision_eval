id = "glm-5-3-flash"
hf_repo = "zai-org/GLM-5.3-Flash"
revision = "46a050bec13002ad29ee795c16e61cf4fa3c4a9c"
developer = "Zhipu AI (Z.ai)"
country = "China"
released = "2026-08-25"
license = "mit"
hf_architecture = "Glm5NextForConditionalGeneration"
architecture = "mixture of experts with vision encoder"
params_total_b = 321.3
params_active_b = 17.4   # counted by tools/param_count.py (2026-11-09)
weights_dtype = "fp8"
weights_gb = 328.3
engine = "vllm_0_33_0"
reasoning = "always"
status_note = "Requires Hopper or Blackwell graphics processors. vLLM, the software that runs the model, has no compatible implementation of its sparse-attention calculation for A100 or L40S processors (2026-11-09)"
max_model_len = 16384
role = "generalist"

# GPU plans per partition. Remove a block to keep the model off that partition.
[serve.a100]
gpus = 8
tp = 8

[engine_args]
# A100 has no native FP8; use the Marlin weight-only FP8 MoE kernel.
moe_backend = "marlin"
# extra flags passed to the engine, e.g. tokenizer_mode = "mistral"

[chat_template_kwargs]
# Always reasons; the template accepts low or high (default max). Lowest effort for the benchmark.
reasoning_effort = "low"

[sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 4096
seed = 20261108
