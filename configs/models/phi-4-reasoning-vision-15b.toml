developer = "Microsoft"
country = "United States"
released = "2026-01-23"
license = "mit"
hf_architecture = "Phi4ForCausalLMV"
architecture = "dense transformer with vision encoder"
params_total_b = 15.1
params_active_b = 15.1
weights_dtype = "bf16"
