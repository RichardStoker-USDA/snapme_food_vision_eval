# Model code expects helpers that transformers 5 moved; hpc/atlas/shims/siglip2_compat puts them back.
python_shim = "siglip2_compat"
reasoning = "always"
max_model_len = 16384

# GPU plans per partition. Remove a block to keep the model off that partition.
[serve.a100]
gpus = 1
tp = 1

[serve.l40s]
gpus = 1
