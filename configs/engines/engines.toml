# Inference engines, pinned by image digest. Every run records the engine id.
# All engines expose the same OpenAI-compatible chat API, so the harness does
# not depend on which one serves a model. Add a new engine by adding a block
# and building its image with hpc/atlas/build_container.sbatch.

