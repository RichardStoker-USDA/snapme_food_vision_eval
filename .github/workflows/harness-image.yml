# Build the harness image (containers/harness.Dockerfile) and publish it to GitHub Container Registry:
#   ghcr.io/<owner>/snapme_food_vision_eval:latest      newest main
#   ghcr.io/<owner>/snapme_food_vision_eval:<sha>       every main commit that changes the harness
#   ghcr.io/<owner>/snapme_food_vision_eval:<tag>       release tags such as v2026.11.09
# Engine images are not rebuilt; they are the upstream vLLM, SGLang and LMDeploy images pinned by digest in
# configs/engines/engines.toml.
name: harness-image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "configs/**", "tools/**", "pixi.toml", "pixi.lock", "pyproject.toml", "project.toml",
            "containers/harness.Dockerfile", ".github/workflows/harness-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: harness-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/snapme_food_vision_eval
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=SNAPMe Food Vision Eval harness
            org.opencontainers.image.licenses=CC0-1.0
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: containers/harness.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
